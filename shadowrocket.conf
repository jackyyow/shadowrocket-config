# Shadowrocket 规则配置（规则集版）
# 生成时间：2026-10-31
# 规则集来源：https://github.com/jackyyow/ios_rule_script（fork 自 blackmatrix7/ios_rule_script）
# 手动保留：WireGuard 内网（WG）、LAN 直连
# 说明：本地 WireGuard/LAN 为手动规则，其余全部改为远程规则集（RULE-SET）

[General]
tun-excluded-routes = 100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,239.255.255.250/32
bypass-system = true
skip-proxy = localhost,*.local,captive.apple.com,192.168.31.0/24
dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
dns-direct-system = false
icmp-auto-reply = true
always-reject-url-rewrite = false
private-ip-answer = true
dns-direct-fallback-proxy = true
udp-policy-not-supported-behaviour = REJECT

[Rule]
# ==================== 本地 WireGuard 内网（手动保留）====================
IP-CIDR,192.168.31.0/24,WG
IP-CIDR,10.0.8.0/24,WG,no-resolve

